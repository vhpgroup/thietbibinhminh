services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    environment:
      DATABASE_URL: postgres://payload:payload@postgres:5432/binhminh
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-local-development-secret-change-me}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
      PAYLOAD_DB_PUSH: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SALES_NOTIFICATION_EMAIL: ${SALES_NOTIFICATION_EMAIL:-kinhdoanh@thietbibinhminh.com.vn}
      NOTIFICATION_CRON_SECRET: ${NOTIFICATION_CRON_SECRET:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_REGION: ${R2_REGION:-auto}
    ports:
      - "${APP_PORT:-3001}:3000"
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://payload:payload@postgres:5432/binhminh
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-local-development-secret-change-me}
      PAYLOAD_DB_PUSH: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: binhminh
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d binhminh"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  media:
  postgres_data:
