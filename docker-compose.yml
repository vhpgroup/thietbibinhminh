services:
  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://payload:payload@postgres:5432/binhminh
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-local-development-secret-change-me}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
      PAYLOAD_DB_PUSH: "true"
    ports:
      - "${APP_PORT:-3001}:3000"
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://payload:payload@postgres:5432/binhminh
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-local-development-secret-change-me}
      PAYLOAD_DB_PUSH: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: binhminh
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d binhminh"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  media:
  postgres_data:
